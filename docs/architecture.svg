<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 940" width="1400" height="940" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/></marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
    <marker id="aGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/></marker>
    <marker id="aOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker>
    <style>
      .t  { font-size: 13px; fill: #1b1f24; }
      .b  { font-size: 13px; font-weight: bold; fill: #1b1f24; }
      .s  { font-size: 11px; fill: #57606a; }
      .zone { font-size: 11px; font-weight: bold; }
      .lbl { font-size: 11px; font-weight: bold; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1400" height="940" fill="#ffffff"/>
  <text x="700" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#1b1f24">DevOps Challenge: microservice on AWS EKS</text>
  <text x="700" y="54" text-anchor="middle" font-size="13" fill="#57606a">Terraform provisions the platform. Jenkins tests, builds and deploys the app with Helm.</text>

  <!-- ===== Outside AWS: people and source control ===== -->
  <rect x="640" y="68" width="200" height="46" rx="8" fill="#fff" stroke="#57606a" stroke-width="1.5"/>
  <text x="740" y="87" text-anchor="middle" class="b">Users</text>
  <text x="740" y="103" text-anchor="middle" class="s">browser / curl</text>

  <rect x="20" y="250" width="130" height="60" rx="8" fill="#fff" stroke="#57606a" stroke-width="1.5"/>
  <text x="85" y="276" text-anchor="middle" class="b">Developer</text>
  <text x="85" y="294" text-anchor="middle" class="s">pushes code</text>

  <rect x="20" y="380" width="130" height="60" rx="8" fill="#fff" stroke="#57606a" stroke-width="1.5"/>
  <text x="85" y="406" text-anchor="middle" class="b">GitHub repo</text>
  <text x="85" y="424" text-anchor="middle" class="s">Damolak-project</text>

  <line x1="85" y1="310" x2="85" y2="378" stroke="#1f6feb" stroke-width="2" marker-end="url(#aBlue)"/>
  <text x="95" y="349" class="lbl" fill="#1f6feb">git push</text>

  <!-- ===== AWS Region ===== -->
  <rect x="200" y="150" width="1180" height="700" rx="6" fill="none" stroke="#232f3e" stroke-width="1.6" stroke-dasharray="7 4"/>
  <text x="214" y="171" class="b">AWS Region eu-west-1 (personal account; Terraform provider locked to this account ID)</text>

  <!-- ===== VPC ===== -->
  <rect x="220" y="182" width="800" height="652" rx="6" fill="#fbfefb" stroke="#248814" stroke-width="1.8"/>
  <text x="234" y="203" class="zone" fill="#248814" style="fill:#248814">VPC 10.0.0.0/16</text>

  <rect x="240" y="212" width="770" height="28" rx="4" fill="#fff" stroke="#8250df" stroke-width="1.5"/>
  <text x="625" y="231" text-anchor="middle" class="t">Internet Gateway</text>

  <rect x="240" y="258" width="770" height="38" rx="4" fill="#fff" stroke="#1a7f37" stroke-width="1.8"/>
  <text x="625" y="274" text-anchor="middle" class="b">Network Load Balancer (internet-facing, TCP :80)</text>
  <text x="625" y="289" text-anchor="middle" class="s">created automatically by the Kubernetes Service of type LoadBalancer</text>

  <!-- Public subnets -->
  <rect x="240" y="335" width="370" height="140" rx="6" fill="#eef8ee" stroke="#7aa116" stroke-width="1.5"/>
  <text x="252" y="353" class="zone" style="fill:#4d6b0d">Public 10.0.0.0/24 (1a)</text>
  <rect x="640" y="335" width="370" height="140" rx="6" fill="#eef8ee" stroke="#7aa116" stroke-width="1.5"/>
  <text x="652" y="353" class="zone" style="fill:#4d6b0d">Public 10.0.1.0/24 (1b)</text>

  <rect x="255" y="370" width="140" height="85" rx="6" fill="#fff" stroke="#1f6feb" stroke-width="2"/>
  <text x="325" y="392" text-anchor="middle" class="b">Jenkins server</text>
  <text x="325" y="410" text-anchor="middle" class="s">EC2 Ubuntu 24.04</text>
  <text x="325" y="425" text-anchor="middle" class="s">UI :8080 (my IP only)</text>
  <text x="325" y="440" text-anchor="middle" class="s">IAM role, no stored keys</text>

  <rect x="435" y="370" width="160" height="85" rx="6" fill="#fff" stroke="#6e7781" stroke-width="1.5"/>
  <text x="515" y="392" text-anchor="middle" class="b">NAT Gateway</text>
  <text x="515" y="410" text-anchor="middle" class="s">single NAT (cost)</text>
  <text x="515" y="425" text-anchor="middle" class="s">outbound for private</text>
  <text x="515" y="440" text-anchor="middle" class="s">nodes in both AZs</text>

  <!-- Private subnets -->
  <rect x="240" y="500" width="370" height="300" rx="6" fill="#eaf2fb" stroke="#147eba" stroke-width="1.5"/>
  <text x="252" y="518" class="zone" style="fill:#0b5a8a">Private 10.0.10.0/24 (1a)</text>
  <rect x="640" y="500" width="370" height="300" rx="6" fill="#eaf2fb" stroke="#147eba" stroke-width="1.5"/>
  <text x="652" y="518" class="zone" style="fill:#0b5a8a">Private 10.0.11.0/24 (1b)</text>

  <!-- Worker nodes -->
  <rect x="255" y="535" width="340" height="245" rx="6" fill="#fff" stroke="#147eba" stroke-width="1.8"/>
  <text x="270" y="770" class="s">EKS managed node group, t3.medium</text>
  <rect x="270" y="590" width="165" height="65" rx="6" fill="#f0fff4" stroke="#1a7f37" stroke-width="1.8"/>
  <text x="352" y="614" text-anchor="middle" class="b">app pod</text>
  <text x="352" y="632" text-anchor="middle" class="s">FastAPI :8000</text>
  <text x="352" y="646" text-anchor="middle" class="s">non-root, probes, limits</text>
  <rect x="448" y="590" width="135" height="65" rx="6" fill="#fff8f0" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="515" y="614" text-anchor="middle" class="b">CloudWatch</text>
  <text x="515" y="632" text-anchor="middle" class="s">agent + Fluent Bit</text>
  <text x="425" y="695" text-anchor="middle" class="s">kube-proxy, aws-node, coredns</text>

  <rect x="655" y="535" width="340" height="245" rx="6" fill="#fff" stroke="#147eba" stroke-width="1.8"/>
  <text x="670" y="770" class="s">EKS managed node group, t3.medium</text>
  <rect x="670" y="590" width="165" height="65" rx="6" fill="#f0fff4" stroke="#1a7f37" stroke-width="1.8"/>
  <text x="752" y="614" text-anchor="middle" class="b">app pod</text>
  <text x="752" y="632" text-anchor="middle" class="s">FastAPI :8000</text>
  <text x="752" y="646" text-anchor="middle" class="s">non-root, probes, limits</text>
  <rect x="848" y="590" width="135" height="65" rx="6" fill="#fff8f0" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="915" y="614" text-anchor="middle" class="b">CloudWatch</text>
  <text x="915" y="632" text-anchor="middle" class="s">agent + Fluent Bit</text>
  <text x="825" y="695" text-anchor="middle" class="s">kube-proxy, aws-node, coredns</text>

  <!-- ===== AWS managed services (right column) ===== -->
  <text x="1045" y="203" class="zone" style="fill:#57606a">AWS MANAGED SERVICES</text>

  <rect x="1045" y="290" width="320" height="70" rx="6" fill="#fff" stroke="#232f3e" stroke-width="1.8"/>
  <text x="1205" y="313" text-anchor="middle" class="b">EKS control plane</text>
  <text x="1205" y="330" text-anchor="middle" class="s">API endpoint (public + private), access entries</text>
  <text x="1205" y="345" text-anchor="middle" class="s">control plane logs sent to CloudWatch</text>

  <rect x="1045" y="430" width="320" height="70" rx="6" fill="#fff" stroke="#232f3e" stroke-width="1.8"/>
  <text x="1205" y="453" text-anchor="middle" class="b">Amazon ECR</text>
  <text x="1205" y="470" text-anchor="middle" class="s">immutable tags, scan on push</text>
  <text x="1205" y="485" text-anchor="middle" class="s">nodes pull images through the NAT</text>

  <rect x="1045" y="530" width="320" height="150" rx="6" fill="#fff" stroke="#bc4c00" stroke-width="1.8"/>
  <text x="1205" y="553" text-anchor="middle" class="b">Amazon CloudWatch</text>
  <text x="1205" y="574" text-anchor="middle" class="s">Logs: container + control plane logs</text>
  <text x="1205" y="591" text-anchor="middle" class="s">Container Insights: node and pod metrics</text>
  <text x="1205" y="608" text-anchor="middle" class="s">Alarm: node CPU high</text>
  <text x="1205" y="625" text-anchor="middle" class="s">SNS topic: email notification</text>

  <rect x="1045" y="710" width="320" height="70" rx="6" fill="#fff" stroke="#232f3e" stroke-width="1.8"/>
  <text x="1205" y="733" text-anchor="middle" class="b">S3 bucket</text>
  <text x="1205" y="750" text-anchor="middle" class="s">Terraform remote state (versioned,</text>
  <text x="1205" y="765" text-anchor="middle" class="s">native locking, no DynamoDB)</text>

  <!-- ===== Arrows ===== -->
  <!-- user traffic -->
  <line x1="740" y1="114" x2="740" y2="210" stroke="#1a7f37" stroke-width="2.2" marker-end="url(#aGreen)"/>
  <text x="750" y="140" class="lbl" fill="#1a7f37">HTTP :80</text>
  <line x1="740" y1="240" x2="740" y2="256" stroke="#1a7f37" stroke-width="2.2" marker-end="url(#aGreen)"/>
  <line x1="420" y1="296" x2="420" y2="588" stroke="#1a7f37" stroke-width="2.2" marker-end="url(#aGreen)"/>
  <line x1="820" y1="296" x2="820" y2="588" stroke="#1a7f37" stroke-width="2.2" marker-end="url(#aGreen)"/>
  <text x="832" y="400" class="lbl" fill="#1a7f37">TCP :80 to pod :8000</text>

  <!-- CI/CD -->
  <line x1="150" y1="410" x2="253" y2="410" stroke="#1f6feb" stroke-width="2" marker-end="url(#aBlue)"/>
  <text x="156" y="400" class="lbl" fill="#1f6feb">poll + checkout</text>
  <polyline points="325,370 325,316 1030,316 1030,325 1043,325" fill="none" stroke="#1f6feb" stroke-width="2" marker-end="url(#aBlue)"/>
  <text x="520" y="309" class="lbl" fill="#1f6feb">helm upgrade --wait</text>
  <polyline points="325,455 325,488 1043,488" fill="none" stroke="#1f6feb" stroke-width="2" marker-end="url(#aBlue)"/>
  <text x="520" y="481" class="lbl" fill="#1f6feb">docker push</text>

  <!-- outbound from private nodes -->
  <line x1="520" y1="535" x2="520" y2="457" stroke="#6e7781" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#aGrey)"/>
  <text x="528" y="525" class="lbl" fill="#6e7781">outbound</text>

  <!-- logs and metrics -->
  <line x1="983" y1="622" x2="1043" y2="610" stroke="#bc4c00" stroke-width="2" marker-end="url(#aOrange)"/>
  <text x="985" y="600" class="lbl" fill="#bc4c00">logs + metrics</text>

  <!-- ===== Legend ===== -->
  <rect x="200" y="862" width="1180" height="62" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <line x1="220" y1="884" x2="260" y2="884" stroke="#1f6feb" stroke-width="2" marker-end="url(#aBlue)"/>
  <text x="268" y="888" class="s">CI/CD (Jenkins)</text>
  <line x1="390" y1="884" x2="430" y2="884" stroke="#1a7f37" stroke-width="2.2" marker-end="url(#aGreen)"/>
  <text x="438" y="888" class="s">user traffic</text>
  <line x1="530" y1="884" x2="570" y2="884" stroke="#6e7781" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#aGrey)"/>
  <text x="578" y="888" class="s">outbound via NAT</text>
  <line x1="700" y1="884" x2="740" y2="884" stroke="#bc4c00" stroke-width="2" marker-end="url(#aOrange)"/>
  <text x="748" y="888" class="s">logs and metrics</text>
  <text x="220" y="912" class="s">Terraform modules: network, ecr, eks, monitoring, jenkins. Terraform builds the platform once; the Jenkins pipeline releases the application on every push.</text>
</svg>
